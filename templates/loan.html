<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinAI — Loan Eligibility</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar"><a href="/" class="brand">Fin<span>AI</span></a><nav>
<a href="/">Dashboard</a><a href="/loan-checker">Loan Checker</a><a href="/credit-analyzer">Credit Analyzer</a><a href="/emi-calculator">EMI Calculator</a><a href="/ai-tips">AI Tips</a>
</nav></header>
<main class="container">
<section class="page-heading"><p class="eyebrow">MODULE 01 • ML MODEL</p><h1>🏦 Loan Eligibility Checker</h1><p class="subtitle">Enter your financial details to get an estimated eligibility result.</p></section>
<article class="card single-card">
<form id="loanForm"><div class="form-grid">
<label>Age<input type="number" name="age" min="18" max="80" required></label>
<label>Monthly Income (₹)<input type="number" name="monthly_income" min="1" required></label>
<label>Credit Score<input type="number" name="credit_score" min="300" max="900" required></label>
<label>Employment Years<input type="number" name="employment_years" min="0" step="0.1" required></label>
<label>Existing Loan Amount (₹)<input type="number" name="existing_loan_amount" min="0" required></label>
<label>Requested Loan Amount (₹)<input type="number" name="loan_amount" min="1" required></label>
<label class="full">Employment Type<select name="employment_type" required><option value="">Select</option><option>Salaried</option><option>Self-Employed</option><option>Contract</option></select></label>
</div><button class="primary" type="submit">Check Eligibility</button></form>
<div id="loanResult" class="result hidden"></div>
</article>
<div class="back-link"><a href="/">← Back to Dashboard</a></div>
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
